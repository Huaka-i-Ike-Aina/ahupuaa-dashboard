name: Deploy Dashboard

on:
  push:
    branches: [ feature/github-pages-deploy ]
    paths:
      - 'ahupuaa_dashboard.qmd'
      - 'processing_notebook.qmd'
      - 'processed_data/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          lfs: true
      
      - name: Verify processed data
        run: |
          echo "Checking processed data..."
          ls -lh processed_data/
          if [ ! -f "processed_data/carbon_biome_hierarchy.geojson" ]; then
            echo "ERROR: carbon_biome_hierarchy.geojson missing"
            exit 1
          fi
          echo "✓ Processed data found"
      
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.0'
      
      - name: Setup R Dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
      
      - name: Render Dashboard
        run: |
          echo "Rendering ahupuaa_dashboard.qmd..."
          quarto render ahupuaa_dashboard.qmd
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/feature/github-pages-deploy'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages-test
          force_orphan: true
